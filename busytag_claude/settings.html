<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Busy Tag Settings</title>
<style>
  :root {
    --bg: #1f1e1d;
    --card: #2a2927;
    --line: #3a3835;
    --fg: #f5f0e8;
    --muted: #968f87;
    --accent: #d97757;
    --ok: #5fb969;
    --warn: #ff8c28;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Avenir Next", "Helvetica Neue", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 20px 48px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  header h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .spark { width: 26px; height: 26px; color: var(--accent); flex: none; }
  .chip {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px; background: var(--card);
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.on i { background: var(--ok); }
  .chip.app i { background: var(--warn); }
  .lede { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; border: 1px solid transparent;
  }
  .card.current { border-color: var(--line); }
  .top { display: flex; align-items: center; gap: 14px; }
  .ring { position: relative; width: 64px; height: 64px; flex: none; }
  .ring span {
    position: absolute; width: 11px; height: 11px; margin: -5.5px; border-radius: 50%;
    background: #111; transition: background .15s, box-shadow .15s;
  }
  .name { font-weight: 600; font-size: 16px; }
  .sub { color: var(--muted); font-size: 13px; }
  .now {
    display: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); margin-top: 2px;
  }
  .card.current .now { display: block; }

  .row { display: flex; align-items: center; gap: 12px; }
  label.lbl { font-size: 13px; color: var(--muted); width: 74px; flex: none; }
  input[type=color] {
    width: 40px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 8px;
    background: none; cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 5px; }
  input[type=range] { flex: 1 1 auto; width: 100%; accent-color: var(--accent); min-width: 0; }
  output { flex: none; width: 40px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--fg); cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  button {
    font: inherit; font-size: 13px; color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 22px; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 13px; }
  #saved { transition: opacity .3s; opacity: 0; color: var(--ok); }
  #saved.show { opacity: 1; }
  #error { color: #f05a50; }
</style>
</head>
<body>
<main>
  <header>
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor">
      <path d="M12 1.5l1.3 7.2L19.4 4.6l-4.1 6.1 7.2 1.3-7.2 1.3 4.1 6.1-6.1-4.1L12 22.5l-1.3-7.2-6.1 4.1 4.1-6.1L1.5 12l7.2-1.3-4.1-6.1 6.1 4.1z"/></g></svg>
    <h1>Busy Tag LEDs</h1>
    <span class="chip" id="chip"><i></i><span id="chiptext">Connecting…</span></span>
  </header>
  <p class="lede">The colour and brightness of the LED ring for each session state. Changes save on their own and
    show on the ring straight away; dragging a slider previews it for a few seconds.</p>

  <div class="grid" id="grid"></div>

  <footer>
    <span id="hint"></span>
    <span id="saved">Saved</span>
    <span id="error"></span>
  </footer>
</main>

<template id="card">
  <section class="card">
    <div class="top">
      <div class="ring" aria-hidden="true"></div>
      <div>
        <div class="name"></div>
        <div class="sub"></div>
        <div class="now">On the ring now</div>
      </div>
    </div>
    <div class="row">
      <label class="lbl">Colour</label>
      <input type="color">
    </div>
    <div class="row">
      <label class="lbl">Brightness</label>
      <input type="range" min="0" max="100" step="1">
      <output></output>
    </div>
    <div class="row extra"></div>
    <div class="row"><button type="button" class="preview">Preview on tag</button></div>
  </section>
</template>

<script>
const STATES = [
  { id: "working", name: "Working", sub: "A dim dot circles the ring",
    toggle: { key: "working_spinner", label: "Circling dot (off: solid ring)" } },
  { id: "needs_input", name: "Needs input", sub: "Flashes, then stays lit",
    toggle: { key: "flash_on_input", label: "Flash when a session needs me" } },
  { id: "done", name: "Done", sub: "The session finished" },
  { id: "error", name: "Error", sub: "The session stopped with an error" },
];

let settings = null;
const ui = {};

const hex = (r, g, b) => [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("").toUpperCase();
const rgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));

// A stored LED colour is hue x brightness: split it so the max channel is the brightness.
function split(h) {
  const c = rgb(h), m = Math.max(...c);
  if (!m) return { hue: "FFFFFF", pct: 0 };
  return { hue: hex(...c.map(v => v * 255 / m)), pct: Math.round(m / 255 * 100) };
}
function join(hue, pct) {
  return hex(...rgb(hue).map(v => v * pct / 100));
}

// Which stored colour a card edits: the circling dot while it's on, else the solid colour.
function key(id) {
  if (id === "working" && settings.working_spinner) return ["spinner_color"];
  return ["colors", id];
}
function stored(id) {
  const [a, b] = key(id);
  return b ? settings[a][b] : settings[a];
}

function paint(id) {
  const u = ui[id], c = "#" + join(u.hue, u.pct);
  const lit = id === "working" && settings.working_spinner ? [0] : [0, 1, 2, 3, 4, 5, 6];
  u.dots.forEach((d, i) => {
    const on = lit.includes(i);
    d.style.background = on ? c : "#111";
    d.style.boxShadow = on && u.pct ? `0 0 ${4 + u.pct / 8}px ${c}` : "none";
  });
  u.out.value = u.pct + "%";
}

function build() {
  const grid = document.getElementById("grid"), tpl = document.getElementById("card");
  for (const s of STATES) {
    const el = tpl.content.firstElementChild.cloneNode(true);
    el.querySelector(".name").textContent = s.name;
    el.querySelector(".sub").textContent = s.sub;
    const ring = el.querySelector(".ring");
    const dots = [...Array(7)].map((_, i) => {
      const d = document.createElement("span"), a = -Math.PI / 2 + i * 2 * Math.PI / 7;
      d.style.left = 32 + 24 * Math.cos(a) + "px";
      d.style.top = 32 + 24 * Math.sin(a) + "px";
      ring.appendChild(d);
      return d;
    });
    const color = el.querySelector("input[type=color]");
    const range = el.querySelector("input[type=range]");
    const ids = `c-${s.id}`, idr = `r-${s.id}`;
    color.id = ids; el.querySelectorAll("label")[0].htmlFor = ids;
    range.id = idr; el.querySelectorAll("label")[1].htmlFor = idr;
    const u = ui[s.id] = { el, dots, color, range, out: el.querySelector("output"), hue: "FFFFFF", pct: 0 };

    color.addEventListener("input", () => { u.hue = color.value.slice(1).toUpperCase(); paint(s.id); preview(s.id); });
    color.addEventListener("change", () => save(s.id));
    range.addEventListener("input", () => { u.pct = +range.value; paint(s.id); preview(s.id); });
    range.addEventListener("change", () => save(s.id));
    el.querySelector(".preview").addEventListener("click", () => preview(s.id, true));

    if (s.toggle) {
      const t = document.createElement("label");
      t.className = "toggle";
      t.innerHTML = '<input type="checkbox"><span></span>';
      t.querySelector("span").textContent = s.toggle.label;
      const box = t.querySelector("input");
      box.addEventListener("change", async () => {
        settings[s.toggle.key] = box.checked;
        await post("/settings", { [s.toggle.key]: box.checked });
        load(s.id);  // the working card may now edit a different colour
      });
      u.toggle = box;
      el.querySelector(".extra").appendChild(t);
    } else {
      el.querySelector(".extra").remove();
    }
    grid.appendChild(el);
  }
}

function load(id) {
  const u = ui[id], { hue, pct } = split(stored(id));
  u.hue = hue; u.pct = pct;
  u.color.value = "#" + hue.toLowerCase();
  u.range.value = pct;
  const t = STATES.find(s => s.id === id).toggle;
  if (t) u.toggle.checked = settings[t.key];
  paint(id);
}

let last = 0, pending = null;
function preview(id, now) {
  const send = () => { last = Date.now(); post("/preview", { color: join(ui[id].hue, ui[id].pct) }, true); };
  clearTimeout(pending);
  if (now || Date.now() - last > 250) send(); else pending = setTimeout(send, 250);
}

async function save(id) {
  const value = join(ui[id].hue, ui[id].pct);
  const [a, b] = key(id);
  const body = b ? { [a]: { [b]: value } } : { [a]: value };
  if (b) settings[a][b] = value; else settings[a] = value;
  if (id === "needs_input") { body.flash_color = value; settings.flash_color = value; }
  if (await post("/settings", body)) flash();
}

async function post(path, body, quiet) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    document.getElementById("error").textContent = "";
    return j;
  } catch (e) {
    if (!quiet) document.getElementById("error").textContent = "Couldn't save: " + e.message;
    return null;
  }
}

let hideSaved;
function flash() {
  const s = document.getElementById("saved");
  s.classList.add("show");
  clearTimeout(hideSaved);
  hideSaved = setTimeout(() => s.classList.remove("show"), 1400);
}

function status(j) {
  const chip = document.getElementById("chip"), text = document.getElementById("chiptext");
  const hint = document.getElementById("hint");
  chip.className = "chip" + (j.connected ? " on" : j.handed_back ? " app" : "");
  text.textContent = j.connected ? "Tag connected" : j.handed_back ? "Tag is with the Busy Tag app" : "Tag not connected";
  hint.textContent = j.connected ? "" : "Settings still save; previews show once a Claude session is active and the tag is connected.";
  for (const s of STATES) ui[s.id].el.classList.toggle("current", j.connected && j.current === s.id);
}

async function refresh(first) {
  try {
    const j = await (await fetch("/settings")).json();
    if (first || !settings) {
      settings = j;
      STATES.forEach(s => load(s.id));
    }
    status(j);
  } catch {
    const chip = document.getElementById("chip");
    chip.className = "chip";
    document.getElementById("chiptext").textContent = "Daemon not running";
  }
}

build();
refresh(true);
setInterval(refresh, 3000);
</script>
</body>
</html>
